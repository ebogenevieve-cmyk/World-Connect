<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Connect - Réseau Social Professionnel</title>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6b7249">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="connect_pro.png">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="World Connect - Créez votre présence digitale professionnelle. Partagez, connectez et développez votre réseau.">
    <meta name="keywords" content="réseau social, professionnel, networking, connexion">

    <!-- External Resources -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <style>
        /* Ajout des styles existants ici */
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Main Content -->
    <main class="spa-container">
        <section class="spa-page active" id="home-page">
            <h1>Bienvenue sur World Connect</h1>
        </section>
    </main>

    <!-- Scripts -->
    <script>
        const loadingOverlay = document.getElementById('loading-overlay');
        const toastContainer = document.getElementById('toast-container');

        // Inialisons Supabase correctement
        const SUPABASE_URL = 'https://your-supabase-url.supabase.co'; // Remplacez par votre URL Supabase
        const SUPABASE_ANON_KEY = 'your-anon-key'; // Remplacez par votre clé publique
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadArticles() {
            try {
                showLoadingOverlay(true);
                const { data, error } = await supabase.from('articles').select('*');
                if (error) {
                    throw error;
                }

                displayArticles(data);
                showToast('Articles chargés avec succès', 'success');
            } catch (err) {
                console.error('Erreur lors du chargement des articles :', err);
                showToast('Erreur lors du chargement des articles', 'error');
            } finally {
                showLoadingOverlay(false);
            }
        }

        function displayArticles(articles) {
            const homePage = document.getElementById('home-page');
            homePage.innerHTML = '';

            articles.forEach(article => {
                const articleDiv = document.createElement('div');
                articleDiv.className = 'article';
                articleDiv.innerHTML = `
                    <h2>${article.title}</h2>
                    <p>${article.content}</p>
                `;
                homePage.appendChild(articleDiv);
            });
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close">&times;</button>
            `;

            toast.querySelector('.toast-close').onclick = () => toast.remove();

            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function showLoadingOverlay(show) {
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        // Chargeons les articles au démarrage
        window.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
